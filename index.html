<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EigenFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <header class="main-header">
    <h1 class="header-title">EigenFlow</h1>
    <p class="header-subtitle">Implementacja API dla badania rozkładów wartości własnych z wykorzystaniem teorii Marchenki-Pastura</p>
  </header>

  <main class="main-area">

    <!-- LEWY PANEL: formularz -->
    <aside class="left-panel">
      <h2>Parametry</h2>

      <form id="simulation-form" class="sidebar-form">

        <!-- Kontener grup N_i i sigma_i² -->
        <div id="groups-container">
          <div class="group-row" style="display:flex; gap:10px; margin-bottom:8px;">
            <label>N<sub>1</sub>: <input type="number" name="n_list" value="10" class="form-input" /></label>
            <label>σ<sub>1</sub><sup>2</sup>: <input type="number" step="0.1" name="sigma_list" value="1.0" class="form-input" /></label>
          </div>
        </div>

        <!-- Przycisk dodawania nowej grupy (skrypt w HTML) -->
        <button type="button" id="add-group" class="add-button">+ Dodaj grupę</button>

        <label>T: <input type="number" name="T" value="100" class="form-input" /></label>
        <label>num_trials: <input type="number" name="num_trials" value="10000" class="form-input" /></label>
        <label>bins: <input type="number" name="bins" value="50" class="form-input" /></label>

        <button type="submit" class="submit-button">Generuj wykres</button>

      </form>
    </aside>

    <!-- Skrypt dodający nowe grupy w HTML -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById('groups-container');
        const addBtn = document.getElementById('add-group');

        addBtn.addEventListener('click', () => {
          const index = container.children.length + 1;
          const div = document.createElement('div');
          div.className = 'group-row';
          div.style.display = 'flex';
          div.style.gap = '10px';
          div.style.marginBottom = '8px';
          div.innerHTML = `
            <label>N${index}: <input type="number" name="n_list" value="10" class="form-input" /></label>
            <label>σ${index}²: <input type="number" step="0.1" name="sigma_list" value="1.0" class="form-input" /></label>
          `;
          container.appendChild(div);
        });
      });
    </script>

    <!-- ŚRODKOWY PANEL: wykres -->
    <section class="center-panel">
      <canvas id="histogram-chart"></canvas>
    </section>

    <!-- PRAWY PANEL: statystyki -->
    <aside class="right-panel stats-container">
      <h3 class="stats-title">Statystyki</h3>
      <div class="stats-list">
        <div class="stat-item"><span class="stat-label">Średnia λ:</span> <span id="mean-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Wariancja λ:</span> <span id="var-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Min λ:</span> <span id="min-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Max λ:</span> <span id="max-lambda" class="stat-value">–</span></div>
      </div>
    </aside>

  </main>

  <footer class="page-footer">
    &copy; 2025 Przemysław Ryś - EigenFlow
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      feather.replace();
    });
  </script>
  <script src="js/main.js"></script>
</body>
</html>
