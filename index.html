<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EigenFlow – Wizualizacja rozkładów</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="assets/js/main.js" defer></script>
</head>

<body>
  <header>
    <h1>EigenFlow</h1>
    <p>Wizualizacja rozkładu wartości własnych</p>
  </header>

  <main>
    <aside class="left-panel">
      <h2>Parametry</h2>
      <form id="simulation-form">
        <label>N1 <input type="number" name="N1" value="10" /></label>
        <label>N2 <input type="number" name="N2" value="10" /></label>
        <label>T <input type="number" name="T" value="100" /></label>
        <label>σ² <input type="number" step="0.1" name="sigma_squared" value="4.0" /></label>
        <label>Liczba prób <input type="number" name="num_trials" value="10000" /></label>
        <label>Bins <input type="number" name="bins" value="50" /></label>

        <button type="submit">Generuj wykres</button>
      </form>
    </aside>

    <section class="right-panel">
      <canvas id="histogram-chart"></canvas>

      <div class="stats">
        <h3>Statystyki</h3>
        <ul>
          <li>Średnia λ: <span id="mean-lambda">–</span></li>
          <li>Wariancja λ: <span id="var-lambda">–</span></li>
          <li>Min λ: <span id="min-lambda">–</span></li>
          <li>Max λ: <span id="max-lambda">–</span></li>
        </ul>
      </div>
    </section>
  </main>

  <footer>
    © 2025 EigenFlow – Chart.js + FastAPI
  </footer>
</body>
</html>
