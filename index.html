<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EigenFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>

  <header class="main-header">
    <h1 class="header-title">EigenFlow</h1>
    <p class="header-subtitle">Implementacja API dla badania rozkładów wartości własnych z wykorzystaniem teorii Marchenki-Pastura</p>
  </header>

  <main class="main-area">

    <!-- LEWY PANEL: formularz -->
    <aside class="left-panel">
      <h2>Parametry</h2>

      <form id="simulation-form">
        <!-- Grupy N i sigma -->
        <div id="groups-container">
          <div class="group-row">
            <label>N<sub>1</sub>: <input type="number" name="N_list" value="10" class="form-input" /></label>
            <label>σ<sub>1</sub><sup>2</sup>: <input type="number" step="0.1" name="sigma_squared_list" value="1.0" class="form-input" /></label>
          </div>
        </div>

        <button type="button" id="add-group" class="add-button">
          + Dodaj grupę
        </button>

        <!-- Pozostałe parametry w kolumnie -->
        <div>
          <div class="single-row">
            <label>T:</label>
            <input type="number" name="T" value="100" class="form-input" />
          </div>
          <div class="single-row">
            <label>num_trials:</label>
            <input type="number" name="num_trials" value="10000" class="form-input" />
          </div>
          <div class="single-row">
            <label>bins:</label>
            <input type="number" name="bins" value="100" class="form-input" />
          </div>
        </div>

        <button type="submit" class="submit-button">Generuj wykres</button>
      </form>
    </aside>

    <!-- <script src="js/main.js"></script> -->

    <!-- ŚRODKOWY PANEL: wykres -->
    <section class="center-panel">
      <canvas id="histogram-chart"></canvas>
    </section>

    <!-- PRAWY PANEL: statystyki -->
    <aside class="right-panel stats-container">
      <h3 class="stats-title">Statystyki</h3>
      <div class="stats-list">
        <div class="stat-item"><span class="stat-label">Średnia λ:</span> <span id="mean-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Wariancja λ:</span> <span id="var-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Min λ:</span> <span id="min-lambda" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Max λ:</span> <span id="max-lambda" class="stat-value">–</span></div>

        <div class="stat-item"><span class="stat-label">N<sub>max</sub>: </span> <span id="N_total" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">r: </span> <span id="r" class="stat-value">–</span></div>
        <div class="stat-item"><span class="stat-label">Czas [s]: </span> <span id="elapsed_time" class="stat-value">–</span></div>
      </div>
    </aside>

  </main>

  <footer class="page-footer">
    &copy; 2025 Przemysław Ryś - EigenFlow
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      feather.replace();
    });
  </script>
  <script src="js/main.js"></script>
</body>
</html>
