<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EigenFlow – Wizualizacja rozkładów</title>
  <link href="assets/css/tailwind.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-blue-700 text-white py-4 shadow">
    <div class="container mx-auto text-center">
      <h1 class="text-2xl font-bold">EigenFlow – Wizualizacja rozkładów</h1>
      <p class="text-blue-200 text-sm">Chart.js + Tailwind + FastAPI</p>
    </div>
  </header>

  <main class="flex-1 container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-6">

      <!-- Formularz parametrów -->
      <div class="md:w-1/2 panel">
        <h2 class="text-xl font-semibold mb-4 text-center">Parametry symulacji</h2>
        <form id="simulation-form" class="grid gap-4 form-grid">
          <div class="grid grid-cols-2 gap-3">
            <label class="flex flex-col text-sm font-medium">N1
              <input class="border rounded p-1" type="number" name="N1" value="10" />
            </label>
            <label class="flex flex-col text-sm font-medium">N2
              <input class="border rounded p-1" type="number" name="N2" value="10" />
            </label>
            <label class="flex flex-col text-sm font-medium">T
              <input class="border rounded p-1" type="number" name="T" value="100" />
            </label>
            <label class="flex flex-col text-sm font-medium">σ²
              <input class="border rounded p-1" type="number" step="0.1" name="sigma_squared" value="4.0" />
            </label>
            <label class="flex flex-col text-sm font-medium">Liczba prób
              <input class="border rounded p-1" type="number" name="num_trials" value="10000" />
            </label>
            <label class="flex flex-col text-sm font-medium">Bins
              <input class="border rounded p-1" type="number" name="bins" value="50" />
            </label>
          </div>
          <button type="submit" class="mt-4 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
            Generuj wykres
          </button>
        </form>
      </div>

      <!-- Wykres i statystyki -->
      <div class="md:w-1/2 panel">
        <h2 class="text-xl font-semibold mb-4 text-center">Wynik</h2>
        <canvas id="histogram-chart" width="600" height="400" class="mx-auto"></canvas>

        <div class="mt-6">
          <h3 class="text-lg font-semibold mb-2 text-center">Statystyki</h3>
          <ul class="stats-list text-sm text-gray-700">
            <li>Średnia λ: <span id="mean-lambda">–</span></li>
            <li>Wariancja λ: <span id="var-lambda">–</span></li>
            <li>Min λ: <span id="min-lambda">–</span></li>
            <li>Max λ: <span id="max-lambda">–</span></li>
          </ul>
        </div>
      </div>

    </div>
  </main>

  <footer class="bg-gray-100 text-center text-gray-500 py-4 border-t">
    © 2025 EigenFlow – Chart.js + Tailwind + FastAPI
  </footer>

</body>
</html>
