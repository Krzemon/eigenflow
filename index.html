<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EigenFlow – Wizualizacja rozkładów</title>
  <link href="assets/css/tailwind.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.3/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- 🔹 Pasek nagłówka -->
  <header class="bg-blue-700 text-white py-4 shadow">
    <div class="container mx-auto text-center">
      <h1 class="text-2xl font-bold">EigenFlow – Wizualizacja rozkładów</h1>
      <p class="text-blue-200 text-sm">HTMX + Tailwind + Chart.js + FastAPI</p>
    </div>
  </header>

  <!-- 🔹 Główna sekcja -->
  <main class="flex-1 container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
      <h2 class="text-xl font-semibold mb-4 text-center">Parametry symulacji</h2>

      <!-- Formularz -->
      <form
        hx-post="http://localhost:8000/mp/plot"
        hx-target="#chart-container"
        hx-swap="innerHTML"
        class="grid gap-4"
      >
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col text-sm font-medium">
            N1
            <input class="border rounded p-1" type="number" name="N1" value="10" />
          </label>
          <label class="flex flex-col text-sm font-medium">
            N2
            <input class="border rounded p-1" type="number" name="N2" value="10" />
          </label>
          <label class="flex flex-col text-sm font-medium">
            T
            <input class="border rounded p-1" type="number" name="T" value="100" />
          </label>
          <label class="flex flex-col text-sm font-medium">
            σ²
            <input class="border rounded p-1" type="number" step="0.1" name="sigma_squared" value="4.0" />
          </label>
          <label class="flex flex-col text-sm font-medium">
            Liczba prób
            <input class="border rounded p-1" type="number" name="num_trials" value="10000" />
          </label>
          <label class="flex flex-col text-sm font-medium">
            Bins
            <input class="border rounded p-1" type="number" name="bins" value="50" />
          </label>
        </div>

        <button
          class="bg-blue-600 text-white py-2 rounded mt-2 hover:bg-blue-700 transition"
          type="submit"
        >
          Generuj wykres
        </button>
      </form>

      <!-- Wynik -->
      <div id="chart-container" class="mt-8 text-center text-gray-600 italic">
        Wygenerowany wykres pojawi się tutaj.
      </div>
    </div>
  </main>

  <!-- 🔹 Stopka -->
  <footer class="bg-gray-100 text-center text-gray-500 py-4 border-t">
    © 2025 EigenFlow – HTMX + Tailwind + FastAPI
  </footer>
</body>
</html>
